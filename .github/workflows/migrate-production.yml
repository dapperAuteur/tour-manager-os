# Migrate the production database after a merge to main, so nobody pastes a connection string.
# Post-deploy automation rule (gemini/witus/CLAUDE.md, shared rules v9). Runbook: docs/01-operations.md,
# "Production migrations".
#
# Runs:
#   - on a push to main that changes supabase/migrations/** (mode migrate);
#   - on demand: Actions -> "Migrate production database" -> Run workflow (mode migrate or rotate-only,
#     plus the one-time baseline_through input);
#   - monthly on a schedule (mode rotate-only), so the Postgres password changes even when no
#     migration ships.
#
# Every run sets a NEW random Postgres password through the Supabase Management API and connects
# with it, so no database password is stored anywhere. The app never reads that password (it uses
# supabase-js with API keys), so rotating it breaks nothing for users. What goes stale: a copy in
# someone's .env.local and the Supabase-Vercel integration's POSTGRES_* variables, which the code
# does not read.
#
# One repository secret, SUPABASE_ACCESS_TOKEN: a Supabase personal access token. Set it without
# showing the value (plans/user-tasks/53):
#   pbpaste | gh secret set SUPABASE_ACCESS_TOKEN --repo dapperAuteur/tour-manager-os
# The job fails closed when it is missing.
#
# Never `supabase db push` this project: it has no Supabase migration history, so that would replay
# every file from 001. scripts/migrate-production.sh keeps its own ledger, witus_ops.schema_migrations.
#
# Timing: Vercel deploys the same push in parallel. Keep migrations additive (new nullable columns,
# new tables) so the old code keeps working while this runs.
name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "migrate: rotate the password, then apply new files. rotate-only: rotate and test the connection, apply nothing."
        type: choice
        options: [migrate, rotate-only]
        default: migrate
      baseline_through:
        description: "One-time setup: record files numbered up to N (e.g. 97) as already applied WITHOUT running them. Leave empty."
        type: string
        required: false
        default: ""
  schedule:
    # 09:17 UTC on the 1st of each month. GitHub turns schedules off in a public repo after 60 days
    # with no commits; re-enable it on the Actions tab if that happens.
    - cron: "17 9 1 * *"

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  # Not secrets. The ref is in the site's public JS bundle (https://<ref>.supabase.co).
  SUPABASE_PROJECT_REF: rwssychlnwynokqswidl
  # Used only if the API does not return the pooler host. Copied 2026-10-30 from the host part of the
  # Session pooler connection string (Supabase dashboard -> Connect -> Session pooler). Runners have no
  # IPv6, so the job uses this IPv4 pooler, never db.<ref>.supabase.co.
  POOLER_HOST_FALLBACK: aws-1-us-east-1.pooler.supabase.com

jobs:
  migrate:
    # Forks have no secret and no business rotating this password.
    if: github.repository == 'dapperAuteur/tour-manager-os'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the repository secret SUPABASE_ACCESS_TOKEN (see docs/01-operations.md, Production migrations)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check psql and jq
        run: |
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version
          jq --version

      - name: Rotate the database password, then migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # push -> migrate; schedule -> rotate-only; workflow_dispatch -> the chosen mode.
          MODE: ${{ github.event_name == 'schedule' && 'rotate-only' || inputs.mode || 'migrate' }}
          # Passed through env (never interpolated into the script) and validated as digits there.
          BASELINE_THROUGH: ${{ inputs.baseline_through }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/migrate-production.sh
